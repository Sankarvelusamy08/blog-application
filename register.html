<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join as a Tech Writer - BlogSpace</title>
  <meta name="description" content="Create a verified author account on BlogSpace to publish your tech stories and connect with engineering leaders." />
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sticky Glass Navbar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <span>Blog<span class="gradient-text">Space</span></span>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme"></button>
        <a href="login.html" class="btn btn-secondary btn-sm">Member Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Join <span class="gradient-text">BlogSpace</span></h1>
        <p class="auth-subtitle">Publish engineering breakthroughs and build domain authority</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="regName" class="form-label">Full Name & Title</label>
          <div class="form-input-wrap">
            <input type="text" id="regName" class="form-input" placeholder="e.g. Elena Rostova" required autocomplete="name" />
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Professional Email</label>
          <div class="form-input-wrap">
            <input type="email" id="regEmail" class="form-input" placeholder="elena@company.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Password (min 6 characters)</label>
          <div class="form-input-wrap">
            <input type="password" id="regPassword" class="form-input" placeholder="Create strong passphrase" minlength="6" required autocomplete="new-password" />
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <div class="form-input-wrap">
            <input type="password" id="regConfirmPassword" class="form-input" placeholder="Repeat passphrase" minlength="6" required autocomplete="new-password" />
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label" style="font-size: 0.85rem;">
            <input type="checkbox" id="termsCheck" required checked />
            <span>I accept the <a href="#" style="color: var(--accent-light);">Terms of Service</a> & <a href="#" style="color: var(--accent-light);">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
          Create Author Account 🚀
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
