<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - BlogSpace</title>
  <meta name="description" content="Log in to your BlogSpace account to write, manage, and share your technical blogs." />
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top Sticky Navigation -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">⚡</span>
        <span>Blog<span class="gradient-text">Space</span></span>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Dark/Light Mode"></button>
        <a href="index.html" class="btn btn-secondary btn-sm">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome <span class="gradient-text">Back</span></h1>
        <p class="auth-subtitle">Log in to continue writing, reading, and engaging.</p>
      </div>

      <!-- Quick Test Hint / Demo Creds Fill -->
      <div class="demo-account-hint">
        <div>
          <strong>Tester Quick Access:</strong>
          <div style="color: var(--text-muted); font-size: 0.775rem;">alex@blogspace.dev • password123</div>
        </div>
        <button type="button" class="btn btn-sm btn-outline" id="demoFillBtn">Fill Demo</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address</label>
          <div class="form-input-wrap">
            <input type="email" id="loginEmail" class="form-input" placeholder="name@domain.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="form-input-wrap">
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-row-remember">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember me</span>
          </label>
          <a href="#" style="color: var(--accent-primary); font-size: 0.85rem;" onclick="showToast('Password reset link sent to registered email (demo)', 'info'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Sign In
        </button>
      </form>

      <div class="auth-divider">or continue with</div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <button class="btn btn-secondary btn-sm" onclick="showToast('Google OAuth connected in production mode', 'info')">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
          Google
        </button>
        <button class="btn btn-secondary btn-sm" onclick="showToast('GitHub OAuth connected in production mode', 'info')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </button>
      </div>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Create one for free</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
